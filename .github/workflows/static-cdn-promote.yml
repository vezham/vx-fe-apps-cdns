name: static-cdn | promote

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character source commit SHA to build and deploy
        required: true
        type: string
      environment:
        description: Destination environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - preview
          - production

permissions:
  contents: write

jobs:
  promote:
    uses: vezham/vx-fe-deployer/.github/workflows/static-cdn-promote.yml@timeline
    secrets: inherit
    with:
      GIT_SHA: ${{ inputs.sha }}
      APP_ENV: ${{ inputs.environment }}
